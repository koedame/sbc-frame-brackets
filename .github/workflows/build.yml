# Builds and checks every model. On a pull request that touches the generator it only checks;
# on a version tag (v*) it also publishes a release with one zip per board (all its 3MF, STL and STEP files),
# the viewer and the fit test coupons attached, which the README links to through releases/latest/download/<file name>.
# Every file of a release is listed in SHA256SUMS and has a build provenance attestation (gh attestation verify).
name: Build

on:
  pull_request:
    paths:
      - "*.py"
      - "boards/*.json"
      - viewer.tpl.html
      - requirements.txt
      - "vendor/**"
      - .github/workflows/build.yml
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1
      - run: pip install -r requirements.txt
      - run: python build_all.py --check --coupons --out models

  # Builds with a read-only token. The job that can publish and attest never runs the build or pip.
  pack:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1
      - run: pip install -r requirements.txt
      - run: python build_all.py --check --coupons --out models
      - name: Pack the release files
        run: |
          # One zip per board, with its files in a folder named after it. A release holds at most 1000 files,
          # and 24 models in 3 formats per board would reach that at 14 boards.
          mkdir pack dist
          for f in boards/*.json; do
            b=$(basename "$f" .json)
            mkdir "pack/$b"
            cp "models/${b}_"* "pack/$b/"
            python -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", "pack", sys.argv[2])' "dist/$b" "$b"
          done
          cp models/viewer.html models/fit_test_*.stl dist/
          # Every file in models/ must be in the release, once.
          total=$(ls models | wc -l)
          packed=$(( $(find pack -type f | wc -l) + $(ls dist | grep -vc '[.]zip$') ))
          if [ "$packed" -ne "$total" ]; then echo "::error::$packed of the $total files in models/ are in the release"; exit 1; fi
          (cd dist && find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS)
          n=$(ls dist | wc -l)
          if [ "$n" -gt 1000 ]; then echo "::error::$n files, but a release holds at most 1000"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          compression-level: 0

  release:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          n=$(ls dist | wc -l)
          # Upload to a draft first, so releases/latest never points at a release with only some of the files.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes
          # GitHub's secondary rate limit can stop a large upload part way. Each try (and a re-run of the job)
          # uploads only the files the release does not have yet, and drops any upload that did not finish.
          for try in 1 2 3 4 5; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.state != "uploaded") | .name' |
              while read -r name; do gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes; done
            have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
            missing=()
            for f in dist/*; do
              grep -qxF "$(basename "$f")" <<< "$have" || missing+=("$f")
            done
            echo "Try $try: ${#missing[@]} of $n files to upload"
            if [ "${#missing[@]}" -eq 0 ] || [ "$try" -eq 5 ]; then break; fi
            if ! gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${missing[@]}" && [ "$try" -lt 4 ]; then sleep 600; fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then echo "::error::${#missing[@]} files are still missing. Re-run this job later"; exit 1; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
