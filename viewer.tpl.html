<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBC Frame Brackets viewer</title>
<style>
/* left = parts list, centre = 3D view, right = specs. The only colours are green for the bracket and red as an accent */
:root{
  --paper:#eceeed; --panel:#f6f7f6; --ink:#1b2224; --dim:#5d686b; --rule:#c9cfce;
  --part:#0f7b6c; --accent:#c8321e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15191a;--panel:#1c2122;--ink:#e3e8e7;--dim:#96a2a3;--rule:#343c3d;--part:#45c0ad;--accent:#ef6a55;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15191a;--panel:#1c2122;--ink:#e3e8e7;--dim:#96a2a3;--rule:#343c3d;--part:#45c0ad;--accent:#ef6a55;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans);display:grid;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:100%}
aside,section{background:var(--panel);overflow:auto;min-height:0}
#list{border-right:1px solid var(--rule)}
#list header{padding:14px;border-bottom:1px solid var(--rule)}
h1{font-size:15px;font-weight:600;margin:0;text-wrap:balance}
#list header p{margin:4px 0 0;color:var(--dim);font-size:12px}
#list header label{display:block;margin-top:10px;font-size:12px;color:var(--dim)}
#orient{display:block;width:100%;margin-top:3px;padding:5px 6px;font:13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:3px}
#orient:focus-visible{outline:2px solid var(--part);outline-offset:1px}
h2{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--dim);margin:14px 0 4px;padding:0 14px}
.row{display:flex;justify-content:space-between;gap:8px;width:100%;padding:7px 14px;border:0;border-left:3px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--paper)}
.row[aria-current="true"]{background:var(--paper);border-left-color:var(--part)}
.row:focus-visible,button:focus-visible{outline:2px solid var(--part);outline-offset:-2px}
.row small{font:12px var(--mono);color:var(--dim)}
#stage{position:relative;min-width:0;min-height:0}
#stage canvas{display:block;width:100%;height:100%}
#bar{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
#bar button{font:12px var(--sans);padding:5px 10px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer}
#bar button[aria-pressed="true"]{border-color:var(--ink)}
#bar button[aria-pressed="false"]{opacity:.6}
#legend{position:absolute;left:12px;bottom:12px;display:flex;gap:14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
#legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
#info{border-left:1px solid var(--rule);padding-bottom:20px}
#info .head{padding:14px;border-bottom:1px solid var(--rule)}
#info .head .id{font:12px var(--mono);color:var(--part)}
#info .head h1{font-size:17px;margin-top:2px}
dl{margin:0;padding:0 14px;display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px}
dt{color:var(--dim)}dd{margin:0}dd.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
ul{margin:0;padding:0 14px 0 30px;font-size:13px}li{margin:3px 0}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--dim)}
@media (max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}html,body{height:auto}#list{border-right:0;border-bottom:1px solid var(--rule);max-height:260px}#info{border-left:0;border-top:1px solid var(--rule)}}
</style>
</head>
<body>
<aside id="list"><header><h1>SBC Frame Brackets</h1><p>Brackets for aluminium extrusion and DIN rail</p><label for="orient">Orientation</label><select id="orient"></select></header><div id="rows"></div></aside>
<main id="stage">
  <div id="bar">
    <button type="button" id="tFrame" aria-pressed="true">Frame / rail</button>
    <button type="button" id="tBoard" aria-pressed="true">Board</button>
    <button type="button" id="tFlip" aria-pressed="false">Upside down</button>
    <button type="button" id="tReset">Reset view</button>
  </div>
  <div id="legend"><span><i style="background:var(--part)"></i>Bracket (printed part)</span><span><i style="background:#9aa3a5"></i>Frame / rail</span><span><i style="background:#8fb0c4"></i>Board</span><span>Drag to rotate, scroll to zoom, right-drag to pan</span></div>
  <div id="err">This browser cannot show 3D content. Open this file in a browser with WebGL.</div>
</main>
<section id="info"></section>
<!--
The two scripts below are three.min.js and OrbitControls.js from three.js r128.
Both are distributed as part of three.js under the following MIT license.

__THREE_LICENSE__
-->
<script>__THREE__</script>
<script>__ORBIT__</script>
<script>
const D=__DATA__;
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stage=$('#stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){$('#err').style.display='flex'}
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(32,1,1,5000); camera.up.set(0,0,1);
let controls=null;
if(renderer){renderer.setPixelRatio(Math.min(devicePixelRatio,2)); stage.prepend(renderer.domElement); controls=new THREE.OrbitControls(camera,renderer.domElement)}
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f90,0.85)); const sun=new THREE.DirectionalLight(0xffffff,0.55); camera.add(sun); sun.position.set(-1,1.5,1); scene.add(camera);
function geom(p){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p.v,3));g.setIndex(p.t);const n=g.toNonIndexed();n.computeVertexNormals();return n}
const cache={};
function getGeom(key,p){return cache[key]||(cache[key]=geom(p))}
const show={frame:true,board:true,flip:false}; let cur=null, frameMesh=null, flipGroup=null;
function load(m){
  if(flipGroup){scene.remove(flipGroup)} if(frameMesh){scene.remove(frameMesh)}
  cur=m;
  frameMesh=new THREE.Mesh(getGeom('f'+m.series,D.frames[m.series]),new THREE.MeshStandardMaterial({color:'#9aa3a5',roughness:.45,metalness:.5}));
  flipGroup=new THREE.Group();
  const bg=getGeom(m.id,m.mesh);
  flipGroup.add(new THREE.Mesh(bg,new THREE.MeshStandardMaterial({color:css('--part'),roughness:.8,side:THREE.DoubleSide})));
  flipGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(bg,28),new THREE.LineBasicMaterial({color:css('--ink'),transparent:true,opacity:.6})));
  const board=new THREE.Mesh(getGeom('g'+m.ghost,D.ghosts[m.ghost]),new THREE.MeshStandardMaterial({color:'#8fb0c4',transparent:true,opacity:.35,depthWrite:false,side:THREE.DoubleSide}));
  board.userData.board=1; flipGroup.add(board);
  scene.add(frameMesh); scene.add(flipGroup); apply(); view(); info(m);
  document.querySelectorAll('.row').forEach(b=>b.setAttribute('aria-current',b.dataset.id===m.id));
}
function apply(){if(!flipGroup)return; frameMesh.visible=show.frame; flipGroup.rotation.y=show.flip?Math.PI:0; flipGroup.children.forEach(o=>{if(o.userData.board)o.visible=show.board})}
function view(){const b=new THREE.Box3().setFromObject(flipGroup.children[0]);const c=b.getCenter(new THREE.Vector3()),r=b.getSize(new THREE.Vector3()).length()/2;
  const d=new THREE.Vector3(-0.9,1,0.55).normalize(); if(controls){controls.target.copy(c)} camera.position.copy(c).addScaledVector(d,r/Math.sin(camera.fov*Math.PI/360)*1.3); if(controls)controls.update(); else camera.lookAt(c)}
function info(m){
  $('#info').innerHTML=`<div class="head"><div class="id">${m.id}</div><h1>${esc(m.title)} · ${esc(m.mount)}${m.spacer?' · integrated standoffs':''}</h1></div>
  <h2>Dimensions</h2><dl><dt>Orientation</dt><dd>${esc(m.orient_label)}</dd><dt>Size</dt><dd class="m">${m.size.join(' x ')} mm</dd><dt>Volume</dt><dd class="m">${m.vol} cm3</dd>${m.min?`<dt>Print time</dt><dd class="m">~${m.min} min (estimate)</dd>`:''}</dl>
  <h2>Board mounting</h2><dl>${m.spacer?`<dt>Standoffs</dt><dd>${m.boss.h} mm tall, ${m.boss.d} mm OD × 4</dd><dt>Screws</dt><dd>${m.boss.screw} self-tapping (${m.boss.pilot} mm pilot hole)</dd>`:`<dt>Holes</dt><dd>3 mm through holes. Bring your own standoffs and screws</dd>`}</dl>
  <h2>Mounting</h2>${m.series==='DIN'?'<ul><li>The centre key sits in the rail channel (between the side walls) and takes the vertical load</li><li>Hooks (0.8 mm) on leaf springs at both sides catch behind the lips. Identical top and bottom</li><li>Push straight on from the front. To remove, put a flat screwdriver in the gap beside a leaf spring and lever it outwards</li></ul>':'<ul><li>Identical hooks (1.0 mm barb) at the top and bottom catch the slots on the top and bottom faces</li><li>A key in the front slot takes the vertical load</li><li>Push straight on from the front. If it will not go on, slide it in from the end of the frame</li></ul>'}
  <h2>Printing</h2><ul><li>${m.orient.startsWith('upright')?'Prints board plate down':'Prints on its side, board plate standing up'}, without supports</li><li>PETG recommended</li></ul>`;
}
const rows=$('#rows'), sel=$('#orient'); let listed=null;   // orientation the list shows
for(const o of [...new Set(D.models.map(m=>m.orient))]){const op=document.createElement('option');op.value=o;op.textContent=D.models.find(m=>m.orient===o).orient_label;sel.append(op)}
function list(o){
  rows.replaceChildren(); let last='';
  for(const m of D.models.filter(x=>x.orient===o)){
    if(m.title!==last){const h=document.createElement('h2');h.textContent=m.title;rows.append(h);last=m.title}
    const b=document.createElement('button');b.className='row';b.type='button';b.dataset.id=m.id;
    b.innerHTML=`<span>${m.series==='DIN'?'DIN rail':m.series+'x'+m.series}${m.spacer?' + standoffs':''}</span><small>${m.size[0]}x${m.size[1]}</small>`;
    b.addEventListener('click',()=>{load(m);try{history.replaceState(null,'','#'+m.id)}catch(_){}});
    rows.append(b);
  }
  listed=sel.value=o;
}
function pick(m){if(listed!==m.orient)list(m.orient);load(m)}
sel.addEventListener('change',()=>{  // keep the same board, mount and standoffs in the new orientation (flat and shelf have no standoffs)
  const same=x=>x.orient===sel.value&&cur&&x.name===cur.name&&x.series===cur.series;
  const m=D.models.find(x=>same(x)&&x.spacer===cur.spacer)||D.models.find(same)||D.models.find(x=>x.orient===sel.value);
  pick(m);try{history.replaceState(null,'','#'+m.id)}catch(_){}
});
function tog(id,k){$(id).addEventListener('click',e=>{show[k]=!show[k];e.currentTarget.setAttribute('aria-pressed',show[k]);apply()})}
tog('#tFrame','frame');tog('#tBoard','board');tog('#tFlip','flip');$('#tReset').addEventListener('click',view);
function size(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage); size();
pick(D.models.find(x=>x.id===location.hash.slice(1))||D.models[0]);
addEventListener('hashchange',()=>{const m=D.models.find(x=>x.id===location.hash.slice(1));if(m)pick(m)});
(function loop(){requestAnimationFrame(loop);if(renderer){renderer.setClearColor(css('--paper'));renderer.render(scene,camera)}})();
</script>
</body>
</html>
